---
- name: Make sure we have a 'wheel' group
  group:
    name: wheel
    state: present

- name: Allow 'wheel' group to have passwordless sudo
  lineinfile:
    path: /etc/sudoers
    state: present
    regexp: '^%wheel'
    line: '%wheel ALL=(ALL) NOPASSWD: ALL'
    validate: '/usr/sbin/visudo -cf %s'

- name: Create a new regular user with sudo privileges
  user:
    name: "{{ create_user }}"
    state: present
    groups: wheel
    append: true
    create_home: true
    shell: /bin/bash

- name: Set authorized key for remote user
  authorized_key:
    user: "{{ create_user }}"
    state: present
    key: "{{ copy_local_key }}"

- name: Disable password authentication for root
  lineinfile:
    path: /etc/ssh/sshd_config
    state: present
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin prohibit-password'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Reload SSH

- name: Update apt
  apt: update_cache=yes

- name: Install required system packages
  apt: name={{ sys_packages }} state=latest

- name: Ensure required packages for venv
  apt:
    name:
      - python3-pip
      - python3-venv
      - python3-full
    state: present
    update_cache: yes

- name: Install Python packages inside venv
  ansible.builtin.pip:
    name:
      - docker
      - requests
    state: present
    virtualenv: /opt/pyenv
    virtualenv_command: python3 -m venv

# cron runs with a minimal PATH; dpkg needs the sbin directories.
# The host cron daemon uses the host timezone.
# Reboots only when the upgrade succeeded and Ubuntu flags it as needed
# (kernel, libc, ...). All app services are enabled systemd units or
# restart: always containers, so they come back on boot.
- name: Setup cron job for nightly Ubuntu update
  ansible.builtin.cron:
    name: "nightly ubuntu update"
    user: root
    minute: "0"
    hour: "1"
    job: >-
      export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      DEBIAN_FRONTEND=noninteractive;
      (apt-get update -q &&
      apt-get upgrade --with-new-pkgs -y -q
      -o DPkg::Lock::Timeout=600
      -o Dpkg::Options::=--force-confdef
      -o Dpkg::Options::=--force-confold &&
      if [ -f /var/run/reboot-required ]; then
      echo "reboot required by:"; cat /var/run/reboot-required.pkgs;
      shutdown -r +1 "nightly update reboot";
      fi)
      > /var/log/nightly-ubuntu-update.log 2>&1
