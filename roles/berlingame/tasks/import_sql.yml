---
- name: Copy and uncompress DB backup file
  unarchive:
    src: "{{ lookup('env','HOME') + '/.ansible/bg.sql.zip' }}"
    dest: /tmp
    owner: root
    group: root
    mode: 0777

- name: Import DB
  shell: docker compose exec -T -e MYSQL_PWD db mysql -uroot < /tmp/bg.sql
  args:
    chdir: "{{ compose_path }}"
  environment:
    MYSQL_PWD: "{{ berlingame_mysql_password }}"
  no_log: true

- name: Create sql for granting permissions
  template:
    src: import.sql.j2
    dest: "/tmp/import.sql"
    owner: root
    group: root
    mode: 0777

- name: Run permissions script
  shell: docker compose exec -T -e MYSQL_PWD db mysql -uroot < /tmp/import.sql
  args:
    chdir: "{{ compose_path }}"
  environment:
    MYSQL_PWD: "{{ berlingame_mysql_password }}"
  no_log: true
