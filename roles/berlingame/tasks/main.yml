---
- name: Creates directory
  file:
    path: "{{ berlingame_path }}"
    state: directory

- name: Creates compose directory
  file:
    path: "{{ compose_path }}"
    state: directory

- name: Update application source
  git:
    repo: "{{ github_repo }}"
    dest: "{{ berlingame_path }}"
    version: master
    force: true
  register: berlingame_checkout
  notify: restart berlingame

- name: Allow write to logs
  file:
    dest: "{{ berlingame_path }}/log"
    owner: root
    group: root
    mode: 0777
    recurse: yes

- name: Allow write to include
  file:
    dest: "{{ berlingame_path }}/include"
    owner: root
    group: root
    mode: 0777
    recurse: yes

- name: Update berlingame php config
  template:
    src: config.php.j2
    dest: "{{ berlingame_path }}/config/config.php"
    owner: root
    group: root
    mode: 0644

- name: Update Compose file
  template:
    src: compose.j2
    dest: "{{ compose_path }}/docker-compose.yml"
    owner: root
    group: root
    mode: 0644
  register: berlingame_compose
  notify: restart berlingame

- name: Systemd service
  template:
    src: berlingame.service.j2
    dest: /etc/systemd/system/berlingame.service
    owner: root
    group: root
    mode: 0644
  register: berlingame_unit
  notify: restart berlingame

# Build before stopping the running service, so a failed build leaves it running.
- name: Build PHP image
  command: docker compose build --pull server
  args:
    chdir: "{{ compose_path }}"
  when: berlingame_checkout.changed or berlingame_compose.changed or berlingame_unit.changed
  changed_when: true
  notify: restart berlingame

- name: Apply service changes before continuing
  meta: flush_handlers

- name: Start service
  systemd:
    name: berlingame
    state: started
    enabled: true

# Check Prague time explicitly; the host cron daemon uses the host timezone.
# Escape % because cron treats an unescaped % as a newline, even inside quotes.
- name: Run job at Prague midnight throughout the year
  ansible.builtin.cron:
    name: berlingame midnight
    minute: "0"
    hour: "*"
    user: root
    job: >-
      if [ "$(TZ={{ cron_timezone | quote }} date +\%H)" = "00" ]; then
      wget -O /dev/null {{ ('http://localhost:' ~ berlingame_service_port ~ '/prepocet.php?heslo=' ~ (prepocet_password | urlencode)) | quote | replace('%', '\\%') }};
      fi

- name: Run SQL import
  import_role:
    name: berlingame
    tasks_from: import_sql
  when: lookup('env', 'run_import') | bool
  tags: berlingame_import_sql
