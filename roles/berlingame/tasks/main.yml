---
- name: Creates directory
  file:
    path: "{{ berlingame_path }}"
    state: directory

- name: Creates compose directory
  file:
    path: "{{ compose_path }}"
    state: directory

- name: Update application source
  git:
    repo: "{{ github_repo }}"
    dest: "{{ berlingame_path }}"
    version: master
    force: true
  register: berlingame_checkout
  notify: restart berlingame

- name: Allow write to logs
  file:
    dest: "{{ berlingame_path }}/log"
    owner: root
    group: root
    mode: 0777
    recurse: yes

- name: Allow write to include
  file:
    dest: "{{ berlingame_path }}/include"
    owner: root
    group: root
    mode: 0777
    recurse: yes

- name: Update berlingame php config
  template:
    src: config.php.j2
    dest: "{{ berlingame_path }}/config/config.php"
    owner: root
    group: root
    mode: 0644

- name: Update Compose file
  template:
    src: compose.j2
    dest: "{{ compose_path }}/docker-compose.yml"
    owner: root
    group: root
    mode: 0644
  register: berlingame_compose
  notify: restart berlingame

- name: Systemd service
  template:
    src: berlingame.service.j2
    dest: /etc/systemd/system/berlingame.service
    owner: root
    group: root
    mode: 0644
  register: berlingame_unit
  notify: restart berlingame

# Build before stopping the running service, so a failed build leaves it running.
- name: Build PHP image
  command: docker compose build --pull server
  args:
    chdir: "{{ compose_path }}"
  when: berlingame_checkout.changed or berlingame_compose.changed or berlingame_unit.changed
  changed_when: true

- name: Apply service changes before continuing
  meta: flush_handlers

- name: Start service
  systemd:
    name: berlingame
    state: started
    enabled: true

# Reconcile even when the checkout/build was unchanged: a previous deployment
# may have built an image without replacing its running container.
- name: Apply current PHP image
  command: docker compose up -d --no-deps server
  args:
    chdir: "{{ compose_path }}"
  register: berlingame_php_up
  changed_when: "'Created' in berlingame_php_up.stderr or 'Recreated' in berlingame_php_up.stderr or 'Started' in berlingame_php_up.stderr"

- name: Verify running PHP image matches built image
  shell: |
    set -eu
    image=$(docker compose config --images server)
    container=$(docker compose ps -q server)
    test -n "$container"
    expected=$(docker image inspect --format '{{ '{{.Id}}' }}' "$image")
    actual=$(docker inspect --format '{{ '{{.Image}}' }}' "$container")
    test "$actual" = "$expected"
  args:
    chdir: "{{ compose_path }}"
  changed_when: false
  when: not ansible_check_mode

# Check Prague time explicitly; the host cron daemon uses the host timezone.
# Escape % because cron treats an unescaped % as a newline, even inside quotes.
- name: Run job at Prague midnight throughout the year
  ansible.builtin.cron:
    name: berlingame midnight
    minute: "0"
    hour: "*"
    user: root
    job: >-
      if [ "$(TZ={{ cron_timezone | quote }} date +\%H)" = "00" ]; then
      wget -O /dev/null {{ ('http://localhost:' ~ berlingame_service_port ~ '/prepocet.php?heslo=' ~ (prepocet_password | urlencode)) | quote | replace('%', '\\%') }};
      fi

- name: Install nightly PHP image update script
  template:
    src: update-php.sh.j2
    dest: /usr/local/bin/berlingame-update-php
    owner: root
    group: root
    mode: 0755

# Runs after the 01:00 nightly apt upgrade from the setup role.
- name: Nightly PHP image update
  ansible.builtin.cron:
    name: berlingame php update
    minute: "0"
    hour: "3"
    user: root
    job: >-
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      /usr/local/bin/berlingame-update-php
      >> /var/log/berlingame-update-php.log 2>&1

- name: Run SQL import
  import_role:
    name: berlingame
    tasks_from: import_sql
  when: lookup('env', 'run_import') | bool
  tags: berlingame_import_sql
