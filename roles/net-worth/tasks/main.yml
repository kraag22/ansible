---
# Ubuntu 24.04 renamed these two libraries with a t64 suffix.
- name: Install packages required by puppeteer (headless chrome)
  apt:
    name: "{{ chrome_headless_dependencies | map('regex_replace', '^(libasound2|libcups2)$', '\\1' ~ net_worth_t64_suffix) | list }}"
    state: present
  vars:
    net_worth_t64_suffix: "{{ 't64' if ansible_facts['distribution_version'] is version('24.04', '>=') else '' }}"

- import_role:
    name: node-webpage
    vars_from: "net-worth"

- name: Setup cron job import
  cron:
    name: "net-worth import"
    minute: "0"
    hour: "23"
    weekday: "1-5"
    user: root
    job: "node {{ node_webpage_path }}/scripts/call.js POST /import >> {{ node_webpage_root }}/cron.log 2>&1"

- name: Setup cron job fill daily
  cron:
    name: "net-worth fill"
    minute: "30"
    hour: "23"
    user: root
    job: "node {{ node_webpage_path }}/scripts/call.js PUT /fill-daily >> {{ node_webpage_root }}/cron.log 2>&1"
