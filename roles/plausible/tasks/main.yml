---
- name: Create plausible directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ admin_username }}"
    group: "{{ admin_username }}"
    mode: "0755"
  loop:
    - "{{ plausible_install_dir }}"
    - "{{ plausible_install_dir }}/clickhouse"

- name: Template out plausible dotenv
  template:
    src: "plausible-conf.env"
    dest: "{{ plausible_install_dir }}/plausible-conf.env"
    owner: "{{ admin_username }}"
    group: "{{ admin_username }}"
    mode: "0600"

- name: Template out plausible docker-compose
  template:
    src: "docker-compose.yml"
    dest: "{{ plausible_install_dir }}/docker-compose.yml"
    owner: "{{ admin_username }}"
    group: "{{ admin_username }}"
    mode: "0600"

- name: Copy clickhouse config
  copy:
    src: "{{ item }}"
    dest: "{{ plausible_install_dir }}/clickhouse/{{ item }}"
    owner: "{{ admin_username }}"
    group: "{{ admin_username }}"
    mode: "0644"
  loop:
    - logs.xml
    - ipv4-only.xml
    - low-resources.xml
    - default-profile-low-resources-overrides.xml

# Compose recreates only the containers whose configuration changed.
- name: Start plausible docker stack
  command: docker compose up -d
  args:
    chdir: "{{ plausible_install_dir }}"
  register: plausible_compose_up
  changed_when: "'Started' in plausible_compose_up.stderr or 'Created' in plausible_compose_up.stderr"
