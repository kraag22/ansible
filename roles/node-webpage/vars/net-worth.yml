---
node_webpage_root: /srv/net_worth
node_webpage_path: /srv/net_worth/api
node_webpage_log_path: /var/log/net_worth
node_webpage_backup_script_path: /srv/backup-net-worth.sh
node_webpage_user: "net-worth"
node_webpage_group: "net-worth"
node_webpage_service_name: net-worth
node_webpage_service_port: "{{ net_worth_service_port }}"
node_webpage_db_file_name: stocks.db
# Role vars stay visible to later roles in the same play, so set these
# explicitly; otherwise another site's repository settings leak in here.
node_webpage_git_repository: ""
node_webpage_git_deploy_key: ""
install_npm_deps: false
